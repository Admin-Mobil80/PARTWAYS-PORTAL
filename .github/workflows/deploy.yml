name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for GitHub's OIDC token. Do not add long-lived AWS keys here.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Defaults are the partways-portal stack outputs (PARTWAYS-BACKEND infra);
      # none is secret. A repository VARIABLE of the same name overrides one.
      ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::720771544607:role/partways-portal-github-deploy' }}
      REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      BUCKET: ${{ vars.S3_BUCKET || 'webapps.partways.org' }}
      PREFIX: ${{ vars.S3_PREFIX || 'PORTAL' }}
      DISTRIBUTION: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID || 'E22ONO2YFDGDK9' }}
    steps:
      - uses: actions/checkout@v4

      # A missing variable fails the run: a skipped deploy reports green, which
      # looks exactly like a successful one.
      - name: Check deploy configuration
        run: |
          missing=""
          if [ -z "$ROLE_ARN" ]; then missing="$missing AWS_DEPLOY_ROLE_ARN"; fi
          if [ -z "$REGION" ]; then missing="$missing AWS_REGION"; fi
          if [ -z "$BUCKET" ]; then missing="$missing S3_BUCKET"; fi
          if [ -z "$PREFIX" ]; then missing="$missing S3_PREFIX"; fi
          if [ -z "$DISTRIBUTION" ]; then missing="$missing CLOUDFRONT_DISTRIBUTION_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error title=Deploy not configured::Missing:$missing. Set them as repository variables, using the partways-portal stack outputs (PARTWAYS-BACKEND infra)."
            exit 1
          fi
          printf '%-28s %s\n' AWS_REGION "$REGION" S3_BUCKET "$BUCKET" S3_PREFIX "$PREFIX" CLOUDFRONT_DISTRIBUTION_ID "$DISTRIBUTION"

      # Plain HTML, CSS and ES modules: there is no build. Only the site files
      # are published, not the repository's own files.
      - name: Prepare site
        run: |
          mkdir -p site
          rsync -a --exclude '.git*' --exclude '.github' --exclude 'README.md' --exclude 'site' ./ site/
          # Open pages poll /version.json and offer a reload when it changes.
          printf '{"version":"%s-%s"}\n' "${GITHUB_SHA::7}" "$(date +%s)" > site/version.json
          find site -type f | sort

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.REGION }}

      # The bucket holds every PartWays web app, so the destination is this
      # app's folder and --delete never reaches a sibling. The deploy role is
      # scoped to the same folder, so a wrong S3_PREFIX fails with AccessDenied.
      # File names are not content-hashed, so every file must revalidate for a
      # deploy to be visible straight away.
      - name: Sync to S3
        run: aws s3 sync site "s3://$BUCKET/${PREFIX%/}" --delete --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*"
